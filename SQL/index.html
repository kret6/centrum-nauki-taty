<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Kurs SQL · Centrum Nauki Taty</title>
<style>
:root{--tlo:#f0f2f5;--karta:#fff;--tekst:#2b2f36;--szary:#5a6270;--linia:#d8dce3;--akcent:#1565c0;--akcent2:#0d47a1;--ok:#14663a;--okt:#e6f4ec;--zle:#a12622;--zlet:#fbeaea;--kod:#f5f6f8;--ciemny:#20242c}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--tlo);color:var(--tekst);margin:0;padding:16px 16px 72px;font-size:17px;line-height:1.5}
main{max-width:820px;margin:0 auto}
a{color:var(--akcent)}
h1{font-size:26px;line-height:1.25;margin:6px 0}
h2{font-size:15px;color:var(--szary);text-transform:uppercase;letter-spacing:.8px;border-bottom:2px solid var(--linia);padding-bottom:5px;margin:32px 0 10px}
h3{font-size:18px;margin:0 0 8px}
.mala{font-size:15px;color:var(--szary)}
.karta{background:var(--karta);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.dzis{border-left:10px solid var(--akcent)}
.przyciski{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button,.btn{font:600 16px 'Segoe UI',Tahoma,sans-serif;border:2px solid var(--akcent);background:var(--karta);color:var(--akcent);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block;min-height:44px}
button.g,.btn.g{background:var(--akcent);color:#fff}
button:hover,.btn:hover{background:var(--akcent2);border-color:var(--akcent2);color:#fff}
textarea{display:block;width:100%;min-height:110px;font:15px/1.45 Consolas,'Courier New',monospace;padding:10px;border:2px solid var(--linia);border-radius:10px;background:var(--kod);color:var(--tekst);resize:vertical;tab-size:2}
textarea:focus{outline:none;border-color:var(--akcent)}
code{font-family:Consolas,'Courier New',monospace;font-size:.9em;background:var(--kod);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
pre{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
pre.kod,pre.plan{background:var(--ciemny);color:#eef0f4;padding:12px;border-radius:10px;font:14px/1.45 Consolas,'Courier New',monospace}
ul{padding-left:22px;margin:8px 0}
.lista a{display:flex;gap:10px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--linia);text-decoration:none;color:var(--tekst)}
.lista a:last-child{border-bottom:0}
.lista a:hover{background:var(--kod)}
.lista .st{flex:0 0 112px;font-size:14px;color:var(--szary)}
.lista .aktualna{font-weight:700}
.lista .aktualna .st{color:var(--akcent)}
.pasek{height:10px;background:var(--linia);border-radius:6px;overflow:hidden;margin:8px 0}
.pasek i{display:block;height:100%;background:var(--akcent)}
.wynik{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;font-size:14px;width:auto;min-width:50%}
th,td{border:1px solid var(--linia);padding:4px 9px;text-align:left;white-space:nowrap}
th{background:var(--kod)}
td.n{color:var(--szary);font-style:italic}
.msg{border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:600;border:2px solid}
.msg.ok{background:var(--okt);color:var(--ok);border-color:var(--ok)}
.msg.zle{background:var(--zlet);color:var(--zle);border-color:var(--zle)}
.msg.info{background:var(--kod);color:var(--szary);border-color:var(--linia);font-weight:400}
.stan{font-size:14px;font-weight:600;color:var(--szary);white-space:nowrap}
.stan.ok{color:var(--ok)}
.glowa{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
details{margin-top:10px}
summary{cursor:pointer;color:var(--akcent);font-weight:600;padding:4px 0}
.opcja{display:block;width:100%;text-align:left;margin-top:8px;font-weight:400;border-color:var(--linia);color:var(--tekst)}
.opcja:hover{color:#fff}
.wpracy{background:#eef3fb;border-left:6px solid var(--akcent)}
.skroty{display:none;gap:6px;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch}
.skroty button{flex:0 0 auto;min-height:40px;min-width:40px;padding:4px 10px;font:600 14px Consolas,'Courier New',monospace;border-color:var(--linia);color:var(--tekst)}
@media (pointer:coarse){.skroty{display:flex}.tylko-pc{display:none}.skroty button:hover{background:var(--karta);border-color:var(--linia);color:var(--tekst)}}
@media (max-width:560px){.lista .st{flex-basis:92px}h1{font-size:23px}.karta{padding:14px}}
</style>
</head>
<body>
<main id="aplikacja"><p class="karta" id="ladowanie">⏳ Ładuję silnik SQL i bazę ćwiczeniową…</p></main>
<script src="vendor/sql-wasm.js"></script>
<script src="vendor/sql-wasm-binarka.js"></script>
<script src="silnik.js"></script>
<script src="tresc.szyfr.js"></script>
<script src="kurs.js"></script>
</body>
</html>
